<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Rekomendasi Beasiswa AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Sistem Rekomendasi Beasiswa (Fuzzy Logic AI)</h2>
    
    <div class="row g-4">
      <!-- Form Input -->
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">Form Pengajuan</div>
          <div class="card-body">
            <form id="formBeasiswa">
              <div class="mb-3">
                <label class="form-label">Nama Mahasiswa</label>
                <!-- ✅ FIX: id diubah jadi "mahasiswaId" biar cocok dengan JS -->
                <input type="text" id="mahasiswaId" class="form-control" placeholder="marmut" required>
              </div>
              <div class="mb-3">
                <label class="form-label">IPK (0.00 - 4.00)</label>
                <input type="number" step="0.01" min="0" max="4" id="ipk" class="form-control" placeholder="3.50" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Penghasilan Orang Tua (Juta Rp)</label>
                <input type="number" step="0.1" min="0" id="penghasilan" class="form-control" placeholder="2.5" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Proses AI</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Hasil & Riwayat -->
      <div class="col-md-7">
        <div id="cardHasil" class="card shadow-sm mb-4 d-none">
          <div class="card-header bg-success text-white">Hasil Rekomendasi AI</div>
          <div class="card-body">
            <h5>Skor Kelayakan: <span id="resSkor" class="fw-bold"></span>%</h5>
            <p><strong>Status:</strong> <span id="resStatus" class="badge"></span></p>
            <p class="mb-0"><strong>Rekomendasi:</strong> <span id="resPesan"></span></p>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-dark text-white">Riwayat Pengajuan</div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-striped mb-0">
                <thead>
                  <tr>
                    <th>Nama Mhs</th>
                    <th>IPK</th>
                    <th>Gaji Ortu</th>
                    <th>Skor</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="tabelRiwayat"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/api/v1";

    document.addEventListener("DOMContentLoaded", loadRiwayat);

    async function loadRiwayat() {
      try {
        const res = await fetch(`${API_URL}/riwayat`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        console.log("📊 Riwayat loaded:", data);

        const tbody = document.getElementById("tabelRiwayat");
        tbody.innerHTML = "";

        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">Belum ada data</td></tr>`;
          return;
        }

        data.forEach(item => {
          const row = `<tr>
            <td>${item.mahasiswa_id}</td>
            <td>${item.ipk}</td>
            <td>Rp ${item.penghasilan_ortu} Jt</td>
            <td>${item.skor_kelayakan}%</td>
            <td><span class="badge ${getBadgeClass(item.status)}">${item.status}</span></td>
          </tr>`;
          tbody.innerHTML += row;
        });
      } catch (err) {
        console.error("❌ Gagal memuat riwayat:", err);
      }
    }

    document.getElementById("formBeasiswa").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        mahasiswa_id: document.getElementById("mahasiswaId").value.trim(),
        ipk: parseFloat(document.getElementById("ipk").value),
        penghasilan_ortu: parseFloat(document.getElementById("penghasilan").value)
      };

      console.log("📤 Payload:", payload);

      // Validasi sederhana
      if (!payload.mahasiswa_id) {
        alert("Nama mahasiswa wajib diisi!");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/rekomendasi`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        console.log("📥 Response:", res.status, result);

        if (!res.ok) {
          alert(`Error ${res.status}: ${result.detail || 'Gagal memproses'}`);
          return;
        }

        // Tampilkan Hasil
        document.getElementById("cardHasil").classList.remove("d-none");
        document.getElementById("resSkor").innerText = result.skor_kelayakan;
        document.getElementById("resPesan").innerText = result.rekomendasi;
        
        const statusElem = document.getElementById("resStatus");
        statusElem.innerText = result.status;
        statusElem.className = `badge ${getBadgeClass(result.status)}`;

        // Reset form
        document.getElementById("formBeasiswa").reset();

        // Refresh Tabel
        loadRiwayat();
      } catch (err) {
        console.error("❌ Submit error:", err);
        alert("Gagal memproses data AI! Cek console browser.");
      }
    });

    function getBadgeClass(status) {
      if (status === "Sangat Layak") return "bg-success";
      if (status === "Dipertimbangkan") return "bg-warning text-dark";
      return "bg-danger";
    }
  </script>
</body>
</html>
